# Internal HTTP-only static server for CheckStation's marketing and Workspace hosts.
# Public TLS is terminated by the host reverse proxy.

map $http_cf_ipcountry $promo_locale {
    default en;
    JP      ja;
}

# Canonical public marketing host. Only known routes may receive the SPA shell.
server {
    listen 80;
    server_name checkstation.app;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /media/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location /brand/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location ~ ^/(favicon\.ico|favicon-(16x16|32x32|48x48|192x192)\.png|apple-touch-icon\.png)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location = /robots.txt { try_files /robots.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; }
    location = /robots-workspace.txt { return 404; }

    # Unprefixed public entry points use the same geo default as the client:
    # Japan -> ja, everywhere else -> en. These are temporary, non-canonical redirects.
    location = / { return 302 /$promo_locale/$is_args$args; }
    location = /features { return 302 /$promo_locale/features$is_args$args; }
    location = /how-it-works { return 302 /$promo_locale/how-it-works$is_args$args; }
    location = /pricing { return 302 /$promo_locale/pricing$is_args$args; }
    location = /contact { return 302 /$promo_locale/contact$is_args$args; }

    location = /en { return 301 /en/$is_args$args; }
    location = /ja { return 301 /ja/$is_args$args; }
    location = /en/ { try_files /en/index.html =404; }
    location = /ja/ { try_files /ja/index.html =404; }

    location ~ ^/(en|ja)/(features|how-it-works|pricing|contact)/+$ {
        return 301 /$1/$2$is_args$args;
    }
    location ~ ^/(en|ja)/(features|how-it-works|pricing|contact)$ {
        try_files $uri/index.html =404;
    }

    # Preserve old/direct auth and app links while moving them to their private host.
    location ~ ^/(login|staff-login|register|check-email|forgot-password|recover-account(?:/.*)?|verify-email/.*|verify-backup-email/.*|verify-primary-email/.*|reset-password/.*|auth/(google|apple)/.*|dashboard(?:/.*)?|account(?:/.*)?|members(?:/.*)?|groups(?:/.*)?|staff(?:/.*)?|history(?:/.*)?|kiosk(?:/.*)?)$ {
        return 302 https://workspace.checkstation.app$request_uri;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        return 404;
    }
}

# Private/authenticated application host. HTML is never eligible for indexing.
server {
    listen 80;
    server_name workspace.checkstation.app;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /media/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /robots.txt {
        try_files /robots-workspace.txt =404;
        default_type text/plain;
    }
    location = /sitemap.xml { return 404; }
    location = /robots-workspace.txt { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Local health checks and unexpected internal hostnames retain SPA behavior but
# are explicitly non-indexable if they ever become externally reachable.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location /assets/ { try_files $uri =404; }
    location /media/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}

# Internal HTTP-only static server for CheckStation SPA (promo + workspace).
# Public TLS / security headers are owned by host nginx later.
# Do not proxy /api here — host nginx routes workspace…/api/* to Gunicorn.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite chunks — long cache.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Feature demo videos and other public media — cacheable, real 404 if missing.
    location /media/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # HTML shell must revalidate so deploys are visible promptly.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f9fc;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f9fc;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#2563eb;font-weight:600;">
                  {{ product_name }}
                </p>
                <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#071426;">
                  {{ heading }}
                </h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#334155;">
                  {{ intro }}
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ action_url }}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:10px;">
                    {{ action_label }}
                  </a>
                </p>
                <p style="margin:0 0 12px;font-size:13px;line-height:1.6;color:#64748b;">
                  This link expires in {{ expiry_hours }} hours. If the button does not work, copy and paste this URL into your browser:
                </p>
                <p style="margin:0 0 20px;font-size:13px;line-height:1.5;color:#2563eb;word-break:break-all;">
                  {{ action_url }}
                </p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#64748b;">
                  {{ security_note }}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

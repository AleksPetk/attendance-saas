{% extends "admin/change_form.html" %}

{% block form_top %}
  {{ block.super }}
  <div class="messagelist">
    <div class="info">
      <strong>Display text only.</strong>
      This setting does not change prices, discounts, Stripe coupons, promotions,
      trials, limits, entitlements, or pricing templates.
    </div>
  </div>
{% endblock %}

{% block extrahead %}
  {{ block.super }}
  <style>
    fieldset.promotional-markets-together[hidden],
    fieldset.promotional-markets-separate[hidden] {
      display: none;
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const mode = document.getElementById("id_mode");
      if (!mode) return;

      const togetherSections = document.querySelectorAll("fieldset.promotional-markets-together");
      const separateSections = document.querySelectorAll("fieldset.promotional-markets-separate");
      const updateSections = function () {
        const separate = mode.value === "separate";
        togetherSections.forEach(function (section) { section.hidden = separate; });
        separateSections.forEach(function (section) { section.hidden = !separate; });
      };

      mode.addEventListener("change", updateSections);
      updateSections();
    });
  </script>
{% endblock %}

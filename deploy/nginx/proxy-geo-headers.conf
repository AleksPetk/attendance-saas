# Snippet to include inside each proxy_pass location that talks to Django
# (workspace /api, /media, manager admin API, etc.).
#
# Always set (and therefore overwrite) X-CheckStation-Country so clients cannot
# spoof it on a direct-origin connection. Clear CF-IPCountry toward the app.

proxy_set_header CF-IPCountry "";
proxy_set_header X-CheckStation-Country $checkstation_trusted_country;

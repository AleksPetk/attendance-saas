<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico?v=20260831" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260831" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png?v=20260831" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=20260831" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-48x48.png?v=20260831" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-192x192.png?v=20260831" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260831" sizes="180x180" />
    <title>__PAGE_TITLE__</title>
    <meta name="description" content="__PAGE_DESCRIPTION__" />
    <link rel="canonical" href="__PAGE_CANONICAL__" />
    __PAGE_HREFLANG__
    <link rel="stylesheet" href="/status.css" />
  </head>
  <body>
    <main class="status-shell">
      <header class="status-brand">
        <div class="status-brand-row">
          <div class="status-brand-copy">
            <img
              class="status-logo"
              src="/brand/logo-text.png"
              width="180"
              height="60"
              alt="CheckStation"
            />
            <p class="status-kicker" id="status-kicker">System Status</p>
          </div>
          <div class="status-language-root" id="status-language-root"></div>
        </div>
      </header>
      <section id="overall" class="overall overall-loading" aria-live="polite">
        <div class="overall-row">
          <span class="status-dot" aria-hidden="true"></span>
          <h1 id="overall-label">Loading status…</h1>
        </div>
        <p id="overall-summary" class="overall-summary" hidden></p>
        <p class="overall-meta">
          <span id="overall-checked">Checking services</span>
          <span id="overall-poll">Auto-updates every 30 seconds</span>
        </p>
      </section>
      <section class="card components-card" aria-label="Components">
        <div id="components">
          <div class="component-group">
            <ul class="component-list" aria-hidden="true">
              <li class="component-row skeleton"><span></span><span></span></li>
              <li class="component-row skeleton"><span></span><span></span></li>
              <li class="component-row skeleton"><span></span><span></span></li>
              <li class="component-row skeleton"><span></span><span></span></li>
            </ul>
          </div>
        </div>
      </section>
      <section class="card panel panel-active" aria-labelledby="active-heading">
        <h2 id="active-heading">Active incidents</h2>
        <div id="active-incidents" class="panel-body">
          <p class="muted">Loading…</p>
        </div>
      </section>
      <section class="card panel" aria-labelledby="recent-heading">
        <h2 id="recent-heading">Recent incidents</h2>
        <div id="recent-incidents" class="panel-body">
          <p class="muted">Loading…</p>
        </div>
      </section>
      <section class="card panel" aria-labelledby="maintenance-heading">
        <h2 id="maintenance-heading">Scheduled maintenance</h2>
        <div id="maintenance" class="panel-body">
          <p class="muted">Loading…</p>
        </div>
      </section>
    </main>
    <script type="module" src="/status.js"></script>
  </body>
</html>

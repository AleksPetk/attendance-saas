# Client / JavaScript verification only.
# Runs packages, frontend, mobile, and desktop tests + typechecks.
# Does not build/sign native apps or deploy.
name: Client CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Harmless deterministic public IDs for client tests that read Vite/Expo config.
  # Not production secrets. No Stripe/Apple/Google private keys.
  VITE_API_BASE_URL: http://127.0.0.1:8000/api
  VITE_WORKSPACE_ORIGIN: http://127.0.0.1:5173
  CI: "true"

jobs:
  packages:
    name: Packages tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          # Repo engines allow >=20. Local and Actions use Node 24 LTS line.
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Package typecheck
        run: npm run typecheck:packages

      - name: Package tests
        run: npm run test:packages

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests (excludes post-build SEO checks)
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Frontend post-build SEO tests
        run: npm run test:postbuild

  mobile:
    name: Mobile tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Mobile typecheck
        run: npm run typecheck:mobile

      - name: Mobile tests
        run: npm run test:mobile

  desktop:
    name: Desktop tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # Desktop planPreview tests import frontend modules that resolve i18next
      # from frontend/node_modules (frontend is not an npm workspace package).
      - name: Install frontend dependencies for shared module imports
        run: npm ci --prefix frontend

      - name: Desktop typecheck
        run: npm run typecheck:desktop

      - name: Desktop renderer + Electron tests
        run: npm run test:desktop
        env:
          # Desktop distribution helpers read this; tests set their own overrides.
          CHECKSTATION_DESKTOP_DISTRIBUTION: direct

# =============================================================================
# CheckStation production Compose
#
# Host nginx (not defined here) terminates TLS and will later route:
#   checkstation.app              → frontend static (promo)
#   workspace.checkstation.app    → frontend static + /api/* → gunicorn
#   docs.checkstation.app         → docs service
#   status.checkstation.app       → status service
#   manager.checkstation.app      → Django /admin/
#
# Public API: https://workspace.checkstation.app/api/...
# There is NO api.checkstation.app.
#
# Infra (db, redis) starts without a profile.
# Application services remain behind profile "app" until deliberately enabled.
# PostgreSQL and Redis are Docker-network-only — never publish host ports.
# =============================================================================

name: checkstation

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    volumes:
      - checkstation_postgres_data:/var/lib/postgresql/data
    networks:
      - checkstation
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    # Intentionally no "ports:" — not reachable from the host or public internet.

  redis:
    image: redis:7-alpine
    # Cache / rate-limit state only — no AOF/RDB persistence required.
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks:
      - checkstation
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    # Intentionally no "ports:" — Docker-network-only (redis:6379).

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DEBUG: "False"
      GUNICORN_BIND: 0.0.0.0:8000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STATUS_PROBE_TOKEN: ${STATUS_PROBE_TOKEN}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application -c gunicorn.conf.py"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - checkstation
    expose:
      - "8000"
    restart: unless-stopped
    profiles: ["app"]

  docs:
    build:
      context: ./docs
    env_file:
      - .env
    environment:
      DOCS_HOST: 0.0.0.0
      DOCS_PORT: 8091
      DOCS_API_BASE_URL: ${DOCS_API_BASE_URL}
      DOCS_INTERNAL_API_URL: ${DOCS_INTERNAL_API_URL}
      DOCS_PUBLIC_URL: ${DOCS_PUBLIC_URL}
      DOCS_MAIN_SITE_URL: ${DOCS_MAIN_SITE_URL}
      STATUS_PUBLIC_URL: ${STATUS_PUBLIC_URL}
    networks:
      - checkstation
    expose:
      - "8091"
    restart: unless-stopped
    profiles: ["app"]

  status:
    build:
      context: ./status
    env_file:
      - .env
    environment:
      STATUS_HOST: 0.0.0.0
      STATUS_PORT: 8090
      STATUS_API_URL: ${STATUS_API_URL}
      STATUS_WEBSITE_URL: ${STATUS_WEBSITE_URL}
      STATUS_WORKSPACE_URL: ${STATUS_WORKSPACE_URL}
      STATUS_DOCS_URL: ${STATUS_DOCS_URL}
      STATUS_PUBLIC_URL: ${STATUS_PUBLIC_URL}
      STATUS_PROBE_TOKEN: ${STATUS_PROBE_TOKEN}
      STATUS_DATA_DIR: /data
    volumes:
      - checkstation_status_data:/data
    networks:
      - checkstation
    expose:
      - "8090"
    restart: unless-stopped
    profiles: ["app"]

networks:
  checkstation:
    name: checkstation_internal
    driver: bridge

volumes:
  checkstation_postgres_data:
    name: checkstation_postgres_data
  checkstation_status_data:
    name: checkstation_status_data
